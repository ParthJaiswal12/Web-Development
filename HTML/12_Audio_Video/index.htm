<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video Tags - </title>
</head>
<body>
    <h1>Audio</h1>
    <!-- Syntax 1 -->
    <audio src="Audio.mp3" controls></audio>
    <!-- Syntax 2 -->
     <audio controls>
        <source src="Audio.mp3">
     </audio>

     <h1>Video</h1>
     <video width="566px" controls>
        <source src="Video.mp4">
     </video>
</body>
</html>
