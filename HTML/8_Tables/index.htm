<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>

<body>
    <h1>Table - </h1>
    <table border="1">

        <tr>
            <th>Sr.</th>
            <th>Item</th>
            <th>Price</th>
            <th>Total Price</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Pen</td>
            <td colspan="2">10Rs</td> <!--Mearge To colem-->
        </tr>

        <tr>
            <td>2</td>
            <td>Book</td>
            <td colspan="2">50Rs</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Paper</td>
            <td rowspan="2"">1Rs</td><!-- mearge 2 row -->
            <td>10Rs</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Pencil</td>
            <td>2Rs</td>
        </tr>

    </table>
</body>

</html>
