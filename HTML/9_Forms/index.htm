<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1>Basic Form - </h1>
    <form action="/example.php">

        <!-- Text Input -->
        <div>
            <label for="FName">First Name</label>
            <input type="text" name="First_Name" id="FName" placeholder="eg:Jone">
            <label for="LName">Last Name</label>
            <input type="text" name="Last_Name" id="LName" placeholder="eg:Doe">
        </div>

        <!-- Telephone Input -->
        <div>
            <label for="phoneNo">Phone Number</label>
            <input type="tel" name="Phone_Number" id="phoneNo" placeholder="1111111111">
        </div>

        <!-- Password Input -->
        <div>
            <label for="Password">Password</label>
            <input type="password" name="Password" id="Password">
        </div>

        <!-- radio Button  -->
        <div>
            <p>Gender - </p>
            <label for="Male">Male</label>
            <input type="radio" name="Gender" id="Male">
            <label for="Female">Female</label>
            <input type="radio" name="Gender" id="Female">
        </div>

        <!-- Checkbox -->
        <div>
            <p>Prefrence - </p>
            <input type="checkbox" name="Prefrence" id="Valorent">
            <label for="Valorent">Valorent</label>
            <input type="checkbox" name="Prefrence" id="CSGO">
            <label for="CSGO">CSGO</label>
            <input type="checkbox" name="Prefrence" id="PUBG">
            <label for="PUBG">PUBG PC</label>
            <input type="checkbox" name="Prefrence" id="COD">
            <label for="COD">Cod</label>
        </div>

        <!-- DropDown Form -->
        <div>
            <label for="city">City</label>
            <select name="City" id="city">
                <option value="Pune">Pune</option>
                <option value="Mumbai">Mumbai</option>
            </select>
        </div>

        <div>
            <label for="suggestion">suggestion - </label>
            <textarea rows="3" cols="20" name="suggestion" id= "suggestion">suggestion</textarea>
        </div>

        <!-- Submit Button -->
        <div>
            <input type="submit" value="Submit">
            <input type="reset" value="reset">
        </div>

    </form>
</body>

</html>
